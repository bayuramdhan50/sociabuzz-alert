<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- 3.5 Inch Floppy Disk -->
  <rect x="25" y="15" width="50" height="52" rx="4" fill="#000080" stroke="#C0C0C0" stroke-width="2"/>
  <!-- Top notch -->
  <polygon points="68,15 75,22 75,15" fill="#C0C0C0"/>
  <!-- Metal Shutter -->
  <rect x="35" y="15" width="28" height="22" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
  <rect x="42" y="20" width="8" height="12" fill="#000080"/>
  <!-- Paper Label -->
  <rect x="32" y="42" width="36" height="22" fill="#FFFFFF"/>
  <line x1="36" y1="48" x2="64" y2="48" stroke="#FF007F" stroke-width="2"/>
  <line x1="36" y1="54" x2="60" y2="54" stroke="#00F5D4" stroke-width="2"/>
</svg>

