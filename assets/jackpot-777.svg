<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="jackpotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Slot Frame -->
  <rect x="18" y="15" width="64" height="48" rx="8" fill="#1A132B" stroke="url(#jackpotGold)" stroke-width="3"/>
  <!-- Lucky 777 -->
  <text x="50" y="48" font-family="'Righteous', sans-serif" font-size="28" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="2">777</text>
  <!-- Lights on Border -->
  <circle cx="24" cy="21" r="2.5" fill="#EF4444"/>
  <circle cx="50" cy="19" r="2.5" fill="#3B82F6"/>
  <circle cx="76" cy="21" r="2.5" fill="#10B981"/>
  <circle cx="24" cy="57" r="2.5" fill="#F59E0B"/>
  <circle cx="76" cy="57" r="2.5" fill="#EC4899"/>
  <!-- Bottom Coin -->
  <ellipse cx="50" cy="68" rx="18" ry="5" fill="url(#jackpotGold)"/>
</svg>
