<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Crossbones -->
  <path d="M 20,20 L 80,80 M 80,20 L 20,80" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Skull Head -->
  <circle cx="50" cy="46" r="28" fill="#FFFFFF"/>
  <!-- Skull Jaw -->
  <rect x="38" y="66" width="24" height="14" rx="4" fill="#FFFFFF"/>
  <!-- Skull Eyes & Nose -->
  <circle cx="41" cy="48" r="7" fill="#111111"/>
  <circle cx="59" cy="48" r="7" fill="#111111"/>
  <polygon points="50,56 46,64 54,64" fill="#111111"/>
  <!-- Teeth -->
  <line x1="44" y1="70" x2="44" y2="76" stroke="#111111" stroke-width="2"/>
  <line x1="50" y1="70" x2="50" y2="76" stroke="#111111" stroke-width="2"/>
  <line x1="56" y1="70" x2="56" y2="76" stroke="#111111" stroke-width="2"/>
  <!-- Straw Hat Ribbon & Brim -->
  <ellipse cx="50" cy="34" rx="42" ry="8" fill="#FFD166"/>
  <rect x="25" y="22" width="50" height="12" fill="#E63946"/>
  <path d="M 25,24 C 25,12 75,12 75,24 Z" fill="#FFD166"/>
</svg>

