<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="crateRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="crateBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Parachute Canopy Top -->
  <path d="M 20,25 C 20,5 80,5 80,25 Z" fill="url(#crateBlue)" opacity="0.9"/>
  <!-- Lines -->
  <line x1="20" y1="25" x2="45" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="80" y1="25" x2="55" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Military Crate -->
  <rect x="35" y="45" width="30" height="28" rx="3" fill="url(#crateRed)" stroke="#F59E0B" stroke-width="2"/>
  <!-- Hazard Cross -->
  <line x1="35" y1="45" x2="65" y2="73" stroke="#F59E0B" stroke-width="2"/>
  <line x1="65" y1="45" x2="35" y2="73" stroke="#F59E0B" stroke-width="2"/>
  <rect x="44" y="54" width="12" height="10" fill="#18181B"/>
</svg>
