<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Tachometer Dial Arc -->
  <path d="M 20,60 A 35,35 0 1,1 80,60" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <!-- Redline Arc Zone -->
  <path d="M 65,22 A 35,35 0 0,1 80,60" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <!-- RPM Needle pointing high -->
  <line x1="50" y1="52" x2="72" y2="28" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="52" r="5" fill="#FFFFFF"/>
  <!-- Checkered Flag / Nitro Text -->
  <text x="50" y="70" font-family="'Orbitron', sans-serif" font-size="9" font-weight="900" fill="#22C55E" text-anchor="middle" letter-spacing="1">RPM x1000</text>
</svg>
